name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  test:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Die Server-Tests laufen mit node:test und node:sqlite.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # Jede Plattform baut auf ihrem eigenen Runner (Electron-Pakete lassen sich nicht sinnvoll überkreuz bauen)
  # und startet die App wirklich: Das Fenster prüft selbst, ob die Oberfläche rendert, und beendet sich.
  desktop:
    name: App ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            arch: --x64 --arm64
            app: dist/prepchef-*-linux-x86_64.AppImage
          - name: Windows
            os: windows-latest
            arch: --x64
            app: dist/win-unpacked/PrepChef.exe
          - name: macOS
            os: macos-latest
            arch: --arm64 --x64
            app: dist/mac-arm64/PrepChef.app/Contents/MacOS/PrepChef
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Virtuelles Display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: App bauen
        shell: bash
        env:
          PREPCHEF_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bun scripts/package.ts ${{ matrix.arch }}

      - name: Fenster-Smoke-Test
        shell: bash
        run: |
          APP=$(ls ${{ matrix.app }} | head -1)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun scripts/smoke-test.ts "$APP"
          else
            bun scripts/smoke-test.ts "$APP"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prepchef-${{ matrix.name }}
          path: |
            dist/prepchef-*.AppImage
            dist/prepchef-*.exe
            dist/prepchef-*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prepchef-*
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        working-directory: dist
        run: |
          ls -la
          sha256sum prepchef-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/prepchef-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
