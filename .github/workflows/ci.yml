name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  test:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Die Server-Tests laufen mit node:test und node:sqlite.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Ausführbare Datei bauen und starten
        run: |
          bun run package
          sh scripts/smoke-test.sh dist/prepchef

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Ausführbare Dateien für alle Plattformen bauen
        env:
          PREPCHEF_VERSION: ${{ github.ref_name }}
        run: bun run package:all

      - name: Linux-Build vor dem Veröffentlichen testen
        run: sh scripts/smoke-test.sh dist/prepchef-linux-x64

      - name: Prüfsummen
        working-directory: dist
        run: |
          rm -f prepchef
          sha256sum prepchef-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/prepchef-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
